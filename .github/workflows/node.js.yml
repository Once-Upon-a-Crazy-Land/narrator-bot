name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax and tests (Node.js 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Work around orphaned policies gitlink in CI
        # Changes only the temporary runner index, not the repository or bot data.
        # Checkout credential cleanup fails on this gitlink without .gitmodules.
        run: git update-index --force-remove narrator-bot-policies
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' '*.cjs' | xargs -0 -r -n 1 node --check
      - name: Run tests
        run: node --test
